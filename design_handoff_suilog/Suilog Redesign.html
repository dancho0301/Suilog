<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suilog Redesign</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(135deg, #C8E8F7 0%, #D8EEF5 50%, #BFD8E8 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, system-ui, sans-serif;
}
::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "blue",
  "fontRound": true
}/*EDITMODE-END*/;

const THEMES = {
  blue: {
    primary: '#3FA8CB',
    primaryDark: '#2C87A8',
    primaryLight: '#B8DFEF',
    primaryBg: '#EEF7FF',
    accent: '#FF8F6B',
    tankTop: '#A8D8EF',
    tankBottom: '#6BBBD8',
    name: '🌊 オーシャンブルー'
  },
  mint: {
    primary: '#3CAF88',
    primaryDark: '#2E8C6C',
    primaryLight: '#A4E0C6',
    primaryBg: '#F0FCF6',
    accent: '#FFB347',
    tankTop: '#A4E0C6',
    tankBottom: '#5CC49A',
    name: '🌿 フレッシュミント'
  },
  coral: {
    primary: '#E06B5A',
    primaryDark: '#C0523F',
    primaryLight: '#F5BDB4',
    primaryBg: '#FFF5F3',
    accent: '#4BA8CB',
    tankTop: '#F5BDB4',
    tankBottom: '#E8806F',
    name: '🪸 サンセットコーラル'
  }
};

// ── SVG Creatures ──
function FishA({ color, flip, size = 44 }) {
  return (
    <svg width={size} height={size * 0.62} viewBox="0 0 52 32" style={{ transform: flip ? 'scaleX(-1)' : 'none' }}>
      <ellipse cx="22" cy="16" rx="17" ry="11" fill={color}/>
      <polygon points="39,16 52,6 52,26" fill={color}/>
      <ellipse cx="21" cy="11" rx="6" ry="2.5" fill="rgba(255,255,255,0.3)"/>
      <circle cx="11" cy="14" r="3" fill="white"/>
      <circle cx="11.8" cy="14" r="1.5" fill="#2A3A4A"/>
      <circle cx="12.4" cy="13.3" r="0.5" fill="white"/>
    </svg>
  );
}
function FishB({ color, flip, size = 34 }) {
  return (
    <svg width={size} height={size * 0.7} viewBox="0 0 40 28" style={{ transform: flip ? 'scaleX(-1)' : 'none' }}>
      <ellipse cx="17" cy="14" rx="13" ry="9" fill={color}/>
      <polygon points="30,14 40,6 40,22" fill={color}/>
      <line x1="14" y1="7" x2="14" y2="21" stroke="rgba(255,255,255,0.35)" strokeWidth="1.2"/>
      <line x1="19" y1="6" x2="19" y2="22" stroke="rgba(255,255,255,0.25)" strokeWidth="1"/>
      <circle cx="9" cy="12" r="2" fill="white"/>
      <circle cx="9.6" cy="12" r="1" fill="#2A3A4A"/>
    </svg>
  );
}
function Jellyfish({ color, size = 36 }) {
  return (
    <svg width={size} height={size * 1.3} viewBox="0 0 36 47">
      <ellipse cx="18" cy="15" rx="15" ry="13" fill={color}/>
      <ellipse cx="18" cy="15" rx="11" ry="8" fill="rgba(255,255,255,0.22)"/>
      <path d="M7,26 Q5,38 9,44" stroke={color} strokeWidth="2.2" fill="none" strokeLinecap="round"/>
      <path d="M12,27 Q11,40 14,45" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round"/>
      <path d="M18,28 Q18,41 19,46" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round"/>
      <path d="M24,27 Q25,40 22,45" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round"/>
      <path d="M29,26 Q31,38 27,44" stroke={color} strokeWidth="2.2" fill="none" strokeLinecap="round"/>
    </svg>
  );
}
function Seaweed({ color, h = 60 }) {
  return (
    <svg width="18" height={h} viewBox={`0 0 18 ${h}`}>
      <path d={`M9,${h} Q4,${h*0.78} 11,${h*0.58} Q17,${h*0.42} 7,${h*0.25} Q2,${h*0.1} 9,0`}
        stroke={color} strokeWidth="3.5" fill="none" strokeLinecap="round"/>
    </svg>
  );
}
function Coral({ color, size = 38 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 38 38">
      <line x1="19" y1="36" x2="19" y2="18" stroke={color} strokeWidth="3.2" strokeLinecap="round"/>
      <line x1="19" y1="26" x2="9" y2="14" stroke={color} strokeWidth="2.5" strokeLinecap="round"/>
      <line x1="19" y1="26" x2="29" y2="14" stroke={color} strokeWidth="2.5" strokeLinecap="round"/>
      <line x1="19" y1="20" x2="11" y2="10" stroke={color} strokeWidth="2" strokeLinecap="round"/>
      <line x1="19" y1="20" x2="27" y2="10" stroke={color} strokeWidth="2" strokeLinecap="round"/>
      <circle cx="19" cy="18" r="3" fill={color}/>
      <circle cx="9" cy="14" r="2.8" fill={color}/>
      <circle cx="29" cy="14" r="2.8" fill={color}/>
      <circle cx="11" cy="10" r="2.4" fill={color}/>
      <circle cx="27" cy="10" r="2.4" fill={color}/>
    </svg>
  );
}

function Bubble({ x, y, r }) {
  return (
    <circle cx={x} cy={y} r={r} fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.7)" strokeWidth="0.8"/>
  );
}

// ── Aquarium Tank SVG ──
function AquariumTank({ theme, width = 350, height = 200, rounded = true }) {
  const t = THEMES[theme];
  const r = rounded ? 20 : 0;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ borderRadius: r, display: 'block' }}>
      <defs>
        <linearGradient id={`water-${theme}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={t.tankTop}/>
          <stop offset="100%" stopColor={t.tankBottom}/>
        </linearGradient>
        <clipPath id={`tank-clip-${theme}`}>
          <rect width={width} height={height} rx={r} ry={r}/>
        </clipPath>
      </defs>
      <g clipPath={`url(#tank-clip-${theme})`}>
        {/* Water */}
        <rect width={width} height={height} fill={`url(#water-${theme})`}/>
        {/* Shimmer */}
        <rect width={width} height={10} fill="rgba(255,255,255,0.35)" rx="0"/>
        {/* Sand */}
        <rect y={height - 38} width={width} height={38} fill="#EDD87A"/>
        <rect y={height - 38} width={width} height={6} fill="#F5E88A"/>
        {/* Rocks */}
        <ellipse cx="85" cy={height - 30} rx="18" ry="10" fill="#C8A87A"/>
        <ellipse cx={width - 100} cy={height - 28} rx="14" ry="9" fill="#D4B080"/>
        {/* Seaweed group 1 */}
        <g transform={`translate(28, ${height - 38})`}><Seaweed color="#4CAF7A" h={70}/></g>
        <g transform={`translate(48, ${height - 38})`}><Seaweed color="#56CC8A" h={50}/></g>
        {/* Seaweed group 2 */}
        <g transform={`translate(${width - 56}, ${height - 38})`}><Seaweed color="#3FA070" h={68}/></g>
        <g transform={`translate(${width - 38}, ${height - 38})`}><Seaweed color="#5ACC90" h={46}/></g>
        {/* Coral */}
        <g transform={`translate(80, ${height - 66})`}><Coral color={t.accent} size={36}/></g>
        <g transform={`translate(${width - 120}, ${height - 58})`}><Coral color={t.primary} size={26}/></g>
        {/* Fish A - large */}
        <g transform="translate(38, 50)"><FishA color="#FFB347" size={50}/></g>
        {/* Fish A - small flipped */}
        <g transform={`translate(${width - 90}, 28)`}><FishA color="#FF8F6B" size={34} flip/></g>
        {/* Fish B */}
        <g transform={`translate(${width - 120}, 95)`}><FishB color={t.primaryLight} size={42} flip/></g>
        {/* Jellyfish */}
        <g transform={`translate(${width / 2 - 18}, 10)`}><Jellyfish color="#C8A8E8" size={40}/></g>
        {/* Bubbles */}
        <svg>
          <Bubble x={55} y={130} r={3.5}/>
          <Bubble x={62} y={110} r={2}/>
          <Bubble x={width/2 + 10} y={145} r={3}/>
          <Bubble x={width - 60} y={130} r={2.5}/>
          <Bubble x={width - 55} y={112} r={1.5}/>
          <Bubble x={160} y={80} r={2}/>
        </svg>
      </g>
    </svg>
  );
}

// ── Tab Bar ──
function TabBar({ activeTab, onTabChange, theme }) {
  const t = THEMES[theme];
  const tabs = [
    { id: 'tank', label: 'マイ水槽', icon: (active) => (
      <svg width="26" height="22" viewBox="0 0 26 22" fill="none">
        <rect x="1" y="4" width="24" height="16" rx="4" stroke={active ? t.primary : '#C0C0CC'} strokeWidth="2" fill={active ? t.primaryBg : 'none'}/>
        <ellipse cx="9" cy="12" rx="4" ry="2.5" fill={active ? t.primary : '#C0C0CC'} opacity="0.7"/>
        <ellipse cx="18" cy="10" rx="3" ry="2" fill={active ? t.accent : '#D0D0DA'} opacity="0.8"/>
        <path d="M1 8h24" stroke={active ? t.primaryLight : '#D8D8E0'} strokeWidth="1.5"/>
      </svg>
    )},
    { id: 'map', label: 'マップ', icon: (active) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke={active ? t.primary : '#C0C0CC'} strokeWidth="2" fill={active ? t.primaryBg : 'none'}/>
        <circle cx="12" cy="9" r="2.5" fill={active ? t.primary : '#C0C0CC'}/>
      </svg>
    )},
    { id: 'records', label: '記録', icon: (active) => (
      <svg width="22" height="24" viewBox="0 0 22 24" fill="none">
        <rect x="2" y="1" width="18" height="22" rx="4" stroke={active ? t.primary : '#C0C0CC'} strokeWidth="2" fill={active ? t.primaryBg : 'none'}/>
        <line x1="6" y1="8" x2="16" y2="8" stroke={active ? t.primary : '#C8C8D4'} strokeWidth="1.8" strokeLinecap="round"/>
        <line x1="6" y1="13" x2="14" y2="13" stroke={active ? t.primary : '#C8C8D4'} strokeWidth="1.8" strokeLinecap="round"/>
        <line x1="6" y1="18" x2="11" y2="18" stroke={active ? t.primary : '#C8C8D4'} strokeWidth="1.8" strokeLinecap="round"/>
      </svg>
    )},
    { id: 'profile', label: 'プロフィール', icon: (active) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke={active ? t.primary : '#C0C0CC'} strokeWidth="2" fill={active ? t.primaryBg : 'none'}/>
        <path d="M4 20c0-4 3.58-7 8-7s8 3 8 7" stroke={active ? t.primary : '#C0C0CC'} strokeWidth="2" strokeLinecap="round" fill="none"/>
      </svg>
    )},
  ];
  return (
    <div style={{
      display: 'flex', background: 'rgba(255,255,255,0.92)',
      borderTop: '0.5px solid rgba(0,0,0,0.08)',
      backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)',
      paddingBottom: 26, paddingTop: 8,
    }}>
      {tabs.map(tab => {
        const active = activeTab === tab.id;
        return (
          <button key={tab.id} onClick={() => onTabChange(tab.id)} style={{
            flex: 1, background: 'none', border: 'none', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
            padding: '6px 0',
          }}>
            {tab.icon(active)}
            <span style={{
              fontSize: 10, fontWeight: active ? 600 : 400,
              color: active ? THEMES[theme].primary : 'rgba(60,60,67,0.5)',
              fontFamily: '-apple-system, system-ui', letterSpacing: '-0.2px'
            }}>{tab.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── Screen: マイ水槽 ──
function TankScreen({ theme, onNav }) {
  const t = THEMES[theme];
  return (
    <div style={{ flex: 1, overflowY: 'auto', background: t.primaryBg }}>
      {/* Header */}
      <div style={{ padding: '58px 20px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
        <div>
          <p style={{ fontSize: 13, color: '#9EB0BB', fontFamily: '-apple-system, system-ui', marginBottom: 4 }}>こんにちは 👋</p>
          <h1 style={{ fontSize: 26, fontWeight: 800, color: '#1A3040', fontFamily: '-apple-system, system-ui', letterSpacing: '-0.5px' }}>マイ水槽</h1>
        </div>
        <div style={{
          width: 42, height: 42, borderRadius: 21, background: t.primary,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: `0 4px 12px ${t.primary}60`
        }}>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <circle cx="11" cy="7" r="4" stroke="white" strokeWidth="2"/>
            <path d="M3 19c0-4 3.58-7 8-7s8 3 8 7" stroke="white" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </div>
      </div>

      {/* Tank card */}
      <div style={{ padding: '0 20px 16px' }}>
        <div style={{
          borderRadius: 24, overflow: 'hidden',
          boxShadow: `0 8px 24px ${t.primary}30`
        }}>
          <AquariumTank theme={theme} width={350} height={195} rounded={false}/>
          <div style={{
            background: 'white', padding: '14px 20px',
            display: 'flex', justifyContent: 'space-around'
          }}>
            {[['3', '水族館'], ['12', '生き物'], ['5', '訪問']].map(([n, l]) => (
              <div key={l} style={{ textAlign: 'center' }}>
                <div style={{ fontSize: 24, fontWeight: 800, color: t.primary, fontFamily: '-apple-system, system-ui' }}>{n}</div>
                <div style={{ fontSize: 11, color: '#AABBC4', fontFamily: '-apple-system, system-ui', marginTop: 1 }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Recent visits */}
      <div style={{ padding: '4px 20px 24px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <h2 style={{ fontSize: 17, fontWeight: 700, color: '#1A3040', fontFamily: '-apple-system, system-ui' }}>最近の訪問</h2>
          <button onClick={() => onNav('records')} style={{
            fontSize: 13, color: t.primary, background: 'none', border: 'none',
            cursor: 'pointer', fontFamily: '-apple-system, system-ui', fontWeight: 500
          }}>すべて見る</button>
        </div>
        {[
          { name: '沖縄美ら海水族館', date: '2025年4月10日', emoji: '🌊', rating: 5 },
          { name: '海遊館', date: '2025年3月2日', emoji: '🐋', rating: 4 },
        ].map((v, i) => (
          <div key={i} onClick={() => onNav('aquarium')} style={{
            background: 'white', borderRadius: 18, padding: '14px 16px',
            marginBottom: 10, display: 'flex', alignItems: 'center', gap: 14,
            boxShadow: '0 2px 10px rgba(0,0,0,0.05)', cursor: 'pointer',
          }}>
            <div style={{
              width: 50, height: 50, borderRadius: 16,
              background: t.primaryBg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26
            }}>{v.emoji}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: '#1A3040', fontFamily: '-apple-system, system-ui' }}>{v.name}</div>
              <div style={{ fontSize: 12, color: '#AABBC4', fontFamily: '-apple-system, system-ui', marginTop: 3 }}>{v.date}</div>
            </div>
            <div style={{ fontSize: 13, color: '#F5B942', letterSpacing: -1 }}>{'★'.repeat(v.rating)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Screen: マップ ──
function MapScreen({ theme, onNav }) {
  const t = THEMES[theme];
  const aquariums = [
    { name: '沖縄美ら海水族館', x: 65, y: 195, visited: true, emoji: '🌊' },
    { name: '海遊館', x: 155, y: 105, visited: true, emoji: '🐋' },
    { name: '葛西臨海水族園', x: 260, y: 78, visited: false, emoji: '🐧' },
    { name: '新江ノ島水族館', x: 235, y: 128, visited: false, emoji: '🦈' },
  ];
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: t.primaryBg, overflow: 'hidden' }}>
      <div style={{ padding: '58px 20px 14px' }}>
        <h1 style={{ fontSize: 26, fontWeight: 800, color: '#1A3040', fontFamily: '-apple-system, system-ui', letterSpacing: '-0.5px' }}>マップ</h1>
      </div>
      {/* Search */}
      <div style={{ padding: '0 20px 14px' }}>
        <div style={{
          background: 'white', borderRadius: 14, padding: '11px 16px',
          display: 'flex', alignItems: 'center', gap: 10,
          boxShadow: '0 2px 10px rgba(0,0,0,0.06)'
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5.5" stroke="#AABBC4" strokeWidth="1.8"/>
            <path d="M11 11l3 3" stroke="#AABBC4" strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
          <span style={{ fontSize: 15, color: '#C8D8E0', fontFamily: '-apple-system, system-ui' }}>水族館を検索...</span>
        </div>
      </div>
      {/* Map */}
      <div style={{ margin: '0 20px', borderRadius: 20, overflow: 'hidden', position: 'relative', height: 240, flexShrink: 0, boxShadow: '0 4px 16px rgba(0,0,0,0.10)' }}>
        <svg width="350" height="240" viewBox="0 0 350 240">
          <rect width="350" height="240" fill="#D8EDF5"/>
          {/* Land mass */}
          <rect x="60" y="30" width="260" height="160" rx="16" fill="#E8F4E8"/>
          <rect x="80" y="50" width="200" height="120" rx="12" fill="#EEF6EE"/>
          {/* Roads */}
          <rect x="0" y="105" width="350" height="7" rx="3.5" fill="rgba(255,255,255,0.7)"/>
          <rect x="162" y="0" width="7" height="240" rx="3.5" fill="rgba(255,255,255,0.7)"/>
          <rect x="0" y="155" width="350" height="5" rx="2.5" fill="rgba(255,255,255,0.5)"/>
          {/* Water */}
          <ellipse cx="40" cy="200" rx="60" ry="50" fill="#B8D8EE"/>
          <path d="M0,180 Q30,160 60,180 Q90,200 0,220Z" fill="#A8CCE0"/>
          {/* Pins */}
          {aquariums.map((a, i) => (
            <g key={i} onClick={() => onNav('aquarium')} style={{ cursor: 'pointer' }}>
              <circle cx={a.x} cy={a.y} r="18" fill={a.visited ? t.primary : 'white'} stroke={a.visited ? t.primaryDark : '#D0DCE4'} strokeWidth="2.5"/>
              <text x={a.x} y={a.y + 7} textAnchor="middle" fontSize="16">{a.emoji}</text>
              {!a.visited && <circle cx={a.x + 10} cy={a.y - 10} r="5" fill={t.accent}/>}
            </g>
          ))}
        </svg>
        {/* Legend */}
        <div style={{
          position: 'absolute', bottom: 12, right: 12,
          background: 'rgba(255,255,255,0.9)', borderRadius: 10, padding: '8px 12px',
          backdropFilter: 'blur(8px)', fontSize: 11, color: '#6A8A98', fontFamily: '-apple-system, system-ui'
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
            <div style={{ width: 10, height: 10, borderRadius: 5, background: t.primary }}/>訪問済み
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <div style={{ width: 10, height: 10, borderRadius: 5, background: 'white', border: '1.5px solid #D0DCE4' }}/>未訪問
          </div>
        </div>
      </div>
      {/* Nearby list */}
      <div style={{ padding: '14px 20px', flex: 1, overflowY: 'auto' }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, color: '#7A9AAA', fontFamily: '-apple-system, system-ui', marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.5px' }}>近くの水族館</h3>
        {aquariums.map((a, i) => (
          <div key={i} onClick={() => onNav('aquarium')} style={{
            background: 'white', borderRadius: 14, padding: '12px 16px',
            marginBottom: 8, display: 'flex', alignItems: 'center', gap: 12,
            boxShadow: '0 2px 8px rgba(0,0,0,0.05)', cursor: 'pointer'
          }}>
            <div style={{
              width: 40, height: 40, borderRadius: 12, background: t.primaryBg,
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22
            }}>{a.emoji}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: '#1A3040', fontFamily: '-apple-system, system-ui' }}>{a.name}</div>
              <div style={{ fontSize: 12, color: a.visited ? t.primary : '#AABBC4', fontFamily: '-apple-system, system-ui', marginTop: 2 }}>
                {a.visited ? '✓ 訪問済み' : '未訪問'} · 2.{i + 1}km
              </div>
            </div>
            <svg width="8" height="13" viewBox="0 0 8 13" fill="none">

                      width: `${(b.progress / b.total) * 100}%`,
                      transition: 'width 0.4s ease'
                    }}/>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Share button */}
        <button style={{
          width: '100%', background: 'white', color: t.primary, border: `2px solid ${t.primaryLight}`,
          borderRadius: 16, padding: '14px', fontSize: 15, fontWeight: 700,
          cursor: 'pointer', fontFamily: '-apple-system, system-ui', marginTop: 20,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="14" cy="3" r="2.5" stroke={t.primary} strokeWidth="1.8"/>
            <circle cx="14" cy="15" r="2.5" stroke={t.primary} strokeWidth="1.8"/>
            <circle cx="4" cy="9" r="2.5" stroke={t.primary} strokeWidth="1.8"/>
            <line x1="6.2" y1="8" x2="11.8" y2="4.2" stroke={t.primary} strokeWidth="1.8" strokeLinecap="round"/>
            <line x1="6.2" y1="10" x2="11.8" y2="13.8" stroke={t.primary} strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
          バッジをシェアする
        </button>
      </div>
    </div>
  );
}

// ── Main App ──
function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = React.useState('tank');
  const [screen, setScreen] = React.useState('main');
  const [tweakOpen, setTweakOpen] = React.useState(false);
  const theme = tweaks.theme;
  const t = THEMES[theme];

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  const handleNav = (dest) => {
    if (dest === 'records') { setActiveTab('records'); setScreen('main'); }
    else if (dest === 'map') { setActiveTab('map'); setScreen('main'); }
    else setScreen(dest);
  };

  const handleTabChange = (tab) => { setActiveTab(tab); setScreen('main'); };

  const isSubscreen = screen !== 'main';

  const renderScreen = () => {
    if (screen === 'record-detail') return <RecordDetailScreen theme={theme} onBack={() => setScreen('main')}/>;
    if (screen === 'aquarium') return <AquariumDetailScreen theme={theme} onBack={() => setScreen('main')} onNav={handleNav}/>;
    if (activeTab === 'tank') return <TankScreen theme={theme} onNav={handleNav}/>;
    if (activeTab === 'map') return <MapScreen theme={theme} onNav={handleNav}/>;
    if (activeTab === 'records') return <RecordsScreen theme={theme} onNav={handleNav}/>;
    return (
      <ProfileScreen theme={theme}/>
    );
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40 }}>
      <IOSDevice width={390} height={844} dark={false}>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: t.primaryBg }}>
          {renderScreen()}
          {!isSubscreen && <TabBar activeTab={activeTab} onTabChange={handleTabChange} theme={theme}/>}
        </div>
      </IOSDevice>

      {/* Tweaks */}
      {tweakOpen && (
        <div style={{
          position: 'fixed', bottom: 24, right: 24,
          background: 'white', borderRadius: 22, padding: '20px 18px', width: 230,
          boxShadow: '0 12px 40px rgba(0,0,0,0.14)', zIndex: 9999,
        }}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 16, fontFamily: '-apple-system, system-ui', color: '#1A3040' }}>Tweaks</div>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#AABBC4', letterSpacing: '0.5px', textTransform: 'uppercase', fontFamily: '-apple-system, system-ui', marginBottom: 10 }}>カラーテーマ</div>
          {Object.entries(THEMES).map(([key, th]) => (
            <button key={key} onClick={() => updateTweak('theme', key)} style={{
              display: 'flex', alignItems: 'center', gap: 10, width: '100%', marginBottom: 6,
              background: theme === key ? th.primaryBg : '#F8F9FA',
              border: `2px solid ${theme === key ? th.primary : 'transparent'}`,
              borderRadius: 10, padding: '9px 12px', cursor: 'pointer',
              fontFamily: '-apple-system, system-ui', fontSize: 13,
              color: '#1A3040', textAlign: 'left', fontWeight: theme === key ? 700 : 400,
              transition: 'all 0.15s'
            }}>
              <div style={{ width: 16, height: 16, borderRadius: 8, background: th.primary, flexShrink: 0 }}/>
              {th.name}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
